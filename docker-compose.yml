version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mountmanor_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mountmanor_local_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-laravel/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mountmanor_local_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional pgAdmin 4 web dashboard for visualizing PostgreSQL tables
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mountmanor_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mountmanor.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
